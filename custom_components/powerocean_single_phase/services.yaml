add_schedule:
  target:
    device:
      integration: powerocean_single_phase
  fields:
    type:
      required: true
      example: charge
      selector:
        select:
          options:
            - charge
            - use_battery
          translation_key: schedule_type
    power:
      required: true
      example: 3000
      selector:
        number:
          min: 1
          step: 1
          mode: box
          unit_of_measurement: W
    start:
      required: true
      example: "02:00:00"
      selector:
        time:
    end:
      required: true
      example: "06:00:00"
      selector:
        time:
    days:
      example: "[mon, tue, wed, thu, fri]"
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
          translation_key: schedule_days
    enabled:
      default: true
      selector:
        boolean:

